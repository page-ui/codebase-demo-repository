name: page-ui

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pageui_dev_password}
      POSTGRES_DB: pageuidb
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pageuidb"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - page-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - page-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - page-network

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - minio_data:/data
    networks:
      - page-network

  create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set myminio http://minio:9000 "${MINIO_ACCESS_KEY:-minioadmin}" "${MINIO_SECRET_KEY:-minioadmin}"
        mc mb --ignore-existing myminio/chat-uploads
        mc mb --ignore-existing myminio/ai-runs
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    networks:
      - page-network
    restart: "no"

  auth-service:
    build:
      context: ./src/backend
      dockerfile: ./Page.Ui.Presentation/Dockerfile
    image: page-ui/auth-service:local
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Database__ApplyMigrationsOnStartup: "true"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=pageuidb;Username=postgres;Password=${DB_PASSWORD:-pageui_dev_password}
      Database__Pooling__MinimumPoolSize: ${API_DB_MIN_POOL_SIZE:-5}
      Database__Pooling__MaximumPoolSize: ${API_DB_MAX_POOL_SIZE:-60}
      Database__Pooling__TimeoutSeconds: ${API_DB_POOL_TIMEOUT_SECONDS:-15}
      Database__Pooling__CommandTimeoutSeconds: ${API_DB_COMMAND_TIMEOUT_SECONDS:-30}
      Redis__ConnectionString: redis:6379
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ACCESS_KEY:-minioadmin}
      Minio__SecretKey: ${MINIO_SECRET_KEY:-minioadmin}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-}
      JWT__Issuer: ${JWT_ISSUER:-AuthService}
      JWT__Audience: ${JWT_AUDIENCE:-AuthService}
      JWT__AccessTokenExpirationMinutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-120}
      JWT__RefreshTokenExpirationDays: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-7}
    volumes:
      - ./src/backend/secrets:/app/secrets
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    networks:
      - page-network

  svelte-render-sandbox:
    build:
      context: ./src/backend
      dockerfile: ./Page.Ui.SvelteRender/Dockerfile.sandbox
    image: page-ui/svelte-render-sandbox:local
    restart: unless-stopped
    entrypoint: ["node", "/app/NodeWorker/runner.js"]
    environment:
      PORT: 4000
      WORK_DIR: /render_jobs
      NODE_OPTIONS: --disallow-code-generation-from-strings
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /render_jobs:rw,noexec,nosuid,size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    networks:
      - render-internal

  svelte-render:
    build:
      context: ./src/backend
      dockerfile: ./Page.Ui.SvelteRender/Dockerfile
    image: page-ui/svelte-render:local
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=pageuidb;Username=postgres;Password=${DB_PASSWORD:-pageui_dev_password}
      Database__Pooling__MinimumPoolSize: ${RENDER_DB_MIN_POOL_SIZE:-2}
      Database__Pooling__MaximumPoolSize: ${RENDER_DB_MAX_POOL_SIZE:-20}
      Database__Pooling__TimeoutSeconds: ${RENDER_DB_POOL_TIMEOUT_SECONDS:-15}
      Database__Pooling__CommandTimeoutSeconds: ${RENDER_DB_COMMAND_TIMEOUT_SECONDS:-30}
      Redis__ConnectionString: redis:6379
      ServiceAuth__ApiKey: ${SVELTE_RENDER_API_KEY:-sr_dev_change_me}
      Sandbox__Endpoint: tcp://svelte-render-sandbox:4000
    read_only: true
    tmpfs:
      - /app/NodeWorker/runs:rw,noexec,nosuid,size=512m
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      auth-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      svelte-render-sandbox:
        condition: service_started
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - page-network
      - render-internal

  ui-ai-service:
    build:
      context: ./src/ai/ui-ai-service
      dockerfile: Dockerfile
    image: page-ui/ui-ai-service:local
    restart: unless-stopped
    shm_size: ${UI_AI_SHM_SIZE:-8gb}
    env_file:
      - .env
    environment:
      BASE_MODEL_ID: ${UI_AI_BASE_MODEL_ID:-Qwen/Qwen2.5-VL-3B-Instruct}
      HF_HOME: /cache/huggingface
      HF_HUB_CACHE: /cache/huggingface/hub
      TOKENIZERS_PARALLELISM: "false"
    ports:
      - "${UI_AI_PORT:-8000}:8000"
    volumes:
      - hf_cache:/cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 10
    networks:
      - page-network

  ai-api:
    build:
      context: ./src/ai/main-ai-service/ai-api
      dockerfile: Dockerfile
    image: page-ui/ai-api:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5000
      BACKEND_BASE_URL: http://gateway
      BACKEND_GRAPHQL_URL: http://gateway/graphql/
      UI_AI_SERVICE_URL: http://ui-ai-service:8000
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    ports:
      - "${AI_API_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - page-network

  worker-ai:
    build:
      context: ./src/backend
      dockerfile: ./Page.Ui.Worker.Ai/Dockerfile
    image: page-ui/worker-ai:local
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=pageuidb;Username=postgres;Password=${DB_PASSWORD:-pageui_dev_password}
      Database__Pooling__MinimumPoolSize: ${WORKER_DB_MIN_POOL_SIZE:-2}
      Database__Pooling__MaximumPoolSize: ${WORKER_DB_MAX_POOL_SIZE:-20}
      Database__Pooling__TimeoutSeconds: ${WORKER_DB_POOL_TIMEOUT_SECONDS:-15}
      Database__Pooling__CommandTimeoutSeconds: ${WORKER_DB_COMMAND_TIMEOUT_SECONDS:-30}
      Redis__ConnectionString: redis:6379
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ACCESS_KEY:-minioadmin}
      Minio__SecretKey: ${MINIO_SECRET_KEY:-minioadmin}
      AiModelApi__BaseUrl: http://ai-api:5000
      AiModelApi__ApiKey: ${AI_API_KEY:-}
      InternalServiceJwt__Issuer: ${AI_INTERNAL_JWT_ISSUER:-Page.Ui.Worker.Ai}
      InternalServiceJwt__Audience: ${AI_INTERNAL_JWT_AUDIENCE:-AiModelApi}
      SvelteRender__BaseUrl: http://svelte-render:8080
      SvelteRender__ApiKey: ${SVELTE_RENDER_API_KEY:-sr_dev_change_me}
    volumes:
      - ./src/backend/secrets:/app/secrets
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      auth-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      svelte-render:
        condition: service_healthy
      ai-api:
        condition: service_healthy
    networks:
      - page-network
      - render-internal

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      auth-service:
        condition: service_healthy
      svelte-render:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - page-network

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    image: page-ui/frontend:local
    restart: unless-stopped
    # Port 8080 removed; now accessed via gateway on port 80
    networks:
      - page-network

volumes:
  postgres_data:
  minio_data:
  hf_cache:

networks:
  page-network:
    driver: bridge
  render-internal:
    driver: bridge
    internal: true
