services:
  ai-api:
    build:
      context: ./ai-api
      dockerfile: Dockerfile
    image: page-ui-ai-service:dev
    container_name: page-ui-ai-api
    environment:
      PORT: 5000

      # Existing .NET backend URLs
      BACKEND_BASE_URL: http://nginx
      BACKEND_GRAPHQL_URL: http://nginx/graphql/

      # Kaggle/ngrok polling settings
      UI_AI_SERVICE_URL: http://ui-ai-service:8000
      UI_AI_ANALYSIS_TIMEOUT_SECONDS: 300
      UI_JOB_START_TIMEOUT_SECONDS: 60
      UI_JOB_POLL_INTERVAL_SECONDS: 15
      UI_JOB_TOTAL_TIMEOUT_SECONDS: 7200
      UI_JOB_TRANSIENT_POLL_FAILURE_LIMIT: 20

      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      PIP_CACHE_DIR: /root/.cache/pip
    ports:
      - "5000:5000"
    networks:
      - page-network
    volumes:
      # Persist Python virtualenv
      - ai_api_venv:/opt/venv

      # Persist downloaded wheels/packages
      - ai_api_pip_cache:/root/.cache/pip

      # Development source mount
      - ./ai-api:/app
    env_file:
      - .env
    command:
      - /bin/sh
      - -c
      - |
        set -e

        if [ ! -d /opt/venv/bin ]; then
          python -m venv /opt/venv
        fi

        REQ_HASH="$$(sha256sum requirements.txt | awk '{print $$1}')"
        OLD_HASH="$$(cat /opt/venv/.requirements.hash 2>/dev/null || true)"

        if [ "$$REQ_HASH" != "$$OLD_HASH" ]; then
          echo "[ai-api] Installing/updating Python dependencies..."
          /opt/venv/bin/pip install --upgrade pip
          /opt/venv/bin/pip install --cache-dir /root/.cache/pip -r requirements.txt
          echo "$$REQ_HASH" > /opt/venv/.requirements.hash
        else
          echo "[ai-api] Dependencies already installed. Using cached venv."
        fi

        exec /opt/venv/bin/python main.py
    restart: unless-stopped

networks:
  page-network:
    external: true
    name: page-ui_page-network

volumes:
  ai_api_venv:
  ai_api_pip_cache:
