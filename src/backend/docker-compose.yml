name: page-ui

services:
  auth-service:
    build:
      context: .
      dockerfile: ./Page.Ui.Presentation/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - Database__ApplyMigrationsOnStartup=true
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=pageuidb;Username=postgres;Password=${DB_PASSWORD:-password}
      - Database__Pooling__MinimumPoolSize=${API_DB_MIN_POOL_SIZE:-5}
      - Database__Pooling__MaximumPoolSize=${API_DB_MAX_POOL_SIZE:-60}
      - Database__Pooling__TimeoutSeconds=${API_DB_POOL_TIMEOUT_SECONDS:-15}
      - Database__Pooling__CommandTimeoutSeconds=${API_DB_COMMAND_TIMEOUT_SECONDS:-30}
      - Redis__ConnectionString=redis:6379
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=${RABBITMQ_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-guest}
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=${MINIO_ACCESS_KEY:-minioadmin}
      - Minio__SecretKey=${MINIO_SECRET_KEY:-minioadmin}
      - Smtp__Host=${SMTP_HOST}
      - Smtp__Port=${SMTP_PORT}
      - Smtp__Username=${SMTP_USERNAME}
      - Smtp__Password=${SMTP_PASSWORD}
      - Smtp__From=${SMTP_FROM}
      - JWT__Issuer=${JWT_ISSUER:-AuthService}
      - JWT__Audience=${JWT_AUDIENCE:-AuthService}
      - JWT__AccessTokenExpirationMinutes=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-120}
      - JWT__RefreshTokenExpirationDays=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-7}
    volumes:
      - ./secrets:/app/secrets
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - page-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M


  worker-ai:
    build:
      context: .
      dockerfile: ./Page.Ui.Worker.Ai/Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=pageuidb;Username=postgres;Password=${DB_PASSWORD:-password}
      - Database__Pooling__MinimumPoolSize=${WORKER_DB_MIN_POOL_SIZE:-2}
      - Database__Pooling__MaximumPoolSize=${WORKER_DB_MAX_POOL_SIZE:-20}
      - Database__Pooling__TimeoutSeconds=${WORKER_DB_POOL_TIMEOUT_SECONDS:-15}
      - Database__Pooling__CommandTimeoutSeconds=${WORKER_DB_COMMAND_TIMEOUT_SECONDS:-30}
      - Redis__ConnectionString=redis:6379
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=${RABBITMQ_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-guest}
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=${MINIO_ACCESS_KEY:-minioadmin}
      - Minio__SecretKey=${MINIO_SECRET_KEY:-minioadmin}
      - AiModelApi__BaseUrl=${AI_MODEL_API_BASE_URL:-}
      - AiModelApi__ApiKey=${AI_MODEL_API_KEY:-}
      - InternalServiceJwt__Issuer=${AI_INTERNAL_JWT_ISSUER:-Page.Ui.Worker.Ai}
      - InternalServiceJwt__Audience=${AI_INTERNAL_JWT_AUDIENCE:-AiModelApi}
      - SvelteRender__BaseUrl=http://svelte-render:8080
      - SvelteRender__ApiKey=${SVELTE_RENDER_API_KEY:-sr_live_58c2a9d8213b4f6e917d3a04c56b78e2}
      - ASPNETCORE_HTTP_PORTS=8080
    volumes:
      - ./secrets:/app/secrets
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      auth-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      svelte-render:
        condition: service_healthy
    networks:
      - page-network
      - render-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M

  svelte-render:
    build:
      context: .
      dockerfile: ./Page.Ui.SvelteRender/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=pageuidb;Username=postgres;Password=${DB_PASSWORD:-password}
      - Database__Pooling__MinimumPoolSize=${RENDER_DB_MIN_POOL_SIZE:-2}
      - Database__Pooling__MaximumPoolSize=${RENDER_DB_MAX_POOL_SIZE:-20}
      - Database__Pooling__TimeoutSeconds=${RENDER_DB_POOL_TIMEOUT_SECONDS:-15}
      - Database__Pooling__CommandTimeoutSeconds=${RENDER_DB_COMMAND_TIMEOUT_SECONDS:-30}
      - Redis__ConnectionString=redis:6379
      - ServiceAuth__ApiKey=${SVELTE_RENDER_API_KEY:-sr_live_58c2a9d8213b4f6e917d3a04c56b78e2}
      - Sandbox__Endpoint=http://svelte-render-sandbox:4000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - page-network
      - render-internal
    user: "0:0"
    read_only: true
    tmpfs:
      - /app/NodeWorker/runs:rw,noexec,nosuid,size=512m
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      auth-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      svelte-render-sandbox:
        condition: service_started
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M

  svelte-render-sandbox:
    build:
      context: .
      dockerfile: ./Page.Ui.SvelteRender/Dockerfile.sandbox
    image: page-ui/svelte-render-sandbox:latest
    entrypoint: ["node", "/app/NodeWorker/runner.js"]
    environment:
      - PORT=4000
      - WORK_DIR=/render_jobs
      - NODE_OPTIONS=--disallow-code-generation-from-strings
    networks:
      - render-internal
    restart: always
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /render_jobs:rw,noexec,nosuid,size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: pageuidb
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d pageuidb" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - page-network

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - page-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - page-network

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - page-network

  create-bucket:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      while ! /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} 2>/dev/null; do
        echo '...waiting for MinIO to start...';
        sleep 2;
      done;
      /usr/bin/mc mb myminio/chat-uploads || echo 'Bucket already exists';
      /usr/bin/mc mb myminio/ai-runs || echo 'Bucket already exists';
      echo 'Bucket created successfully';
      exit 0;
      "
    networks:
      - page-network


  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      auth-service:
        condition: service_started
      svelte-render:
        condition: service_started
    networks:
      - page-network
      - render-internal

volumes:
  postgres_data:
  minio_data:

networks:
  page-network:
    driver: bridge
  render-internal:
    driver: bridge
    internal: true
